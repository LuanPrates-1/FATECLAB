# Banco MySQL local para desenvolvimento: docker compose up -d
services:
  mysql:
    image: mysql:8
    container_name: fateclab-mysql
    environment:
      MYSQL_ROOT_PASSWORD: fateclab
      MYSQL_DATABASE: fateclab
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - fateclab-mysql-data:/var/lib/mysql

volumes:
  fateclab-mysql-data:
