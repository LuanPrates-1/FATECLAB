spring:
  application:
    name: fateclab
  datasource:
    # Em hospedagem, defina DB_URL, DB_USUARIO e DB_SENHA (ver docs/implantacao.md).
    url: ${DB_URL:jdbc:mysql://localhost:3306/fateclab?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USUARIO:root}
    password: ${DB_SENHA:fateclab}
    hikari:
      maximum-pool-size: ${DB_POOL:5}
  jpa:
    hibernate:
      # O esquema é controlado pelo Flyway; o Hibernate apenas valida.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # db/seed contém as trilhas, questões e usuários de demonstração.
    # Para subir sem dados de exemplo: FATECLAB_FLYWAY_LOCATIONS=classpath:db/migration
    locations: ${FATECLAB_FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed}

server:
  port: ${PORT:8080}
  # Respostas compactadas: melhora o carregamento em rede móvel.
  compression:
    enabled: true

fateclab:
  auth:
    # Domínio(s) de e-mail institucional aceitos no cadastro, separados por vírgula.
    dominios-institucionais: ${FATECLAB_DOMINIOS:fatec.sp.gov.br}
    # Segredo para assinar os JWTs. Em hospedagem, SEMPRE defina FATECLAB_JWT_SECRET
    # (mínimo de 32 caracteres).
    jwt-secret: ${FATECLAB_JWT_SECRET:troque-este-segredo-apenas-em-desenvolvimento-local}
    jwt-expiracao-minutos: ${FATECLAB_JWT_EXPIRACAO_MINUTOS:480}
  cors:
    # Origens do front-end autorizadas, separadas por vírgula. Aceita curingas,
    # ex.: https://fateclab.vercel.app,https://*.vercel.app
    origens: ${FATECLAB_CORS_ORIGENS:http://localhost:5173,http://localhost:4173}

logging:
  level:
    br.edu.fatec.fateclab: INFO
