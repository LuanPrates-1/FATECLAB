spring:
  datasource:
    url: jdbc:h2:mem:fateclab;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

fateclab:
  auth:
    dominios-institucionais: fatec.sp.gov.br
    jwt-secret: segredo-de-teste-nao-usar-em-producao-0123456789
    jwt-expiracao-minutos: 60
